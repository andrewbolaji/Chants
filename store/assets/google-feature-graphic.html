<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chants FC Google Play feature graphic</title>
<style>
@font-face{font-family:Anton;src:url('../../assets/fonts/Anton-Regular.ttf') format('truetype');font-display:block;font-weight:400}
@font-face{font-family:SpaceMono;src:url('../../assets/fonts/SpaceMono-Bold.ttf') format('truetype');font-display:block;font-weight:700}
:root{--ink:#080806;--paper:#f3efe6;--gold:#ffc126;--coral:#ee674f}
*{box-sizing:border-box}
html,body{width:1024px;height:500px;margin:0;overflow:hidden;background:var(--ink)}
body{color:var(--paper);font-family:SpaceMono,monospace}
.graphic{position:relative;width:1024px;height:500px;overflow:hidden;background:var(--ink)}
.supporter{position:absolute;right:-46px;top:90px;width:344px;height:344px;object-fit:contain}
.brand{position:absolute;top:50px;left:56px;display:flex;align-items:center;gap:14px;font-size:14px;letter-spacing:.1em}
.mark{display:flex;width:30px;height:30px;align-items:flex-end;justify-content:center;gap:3px;padding:7px;border-radius:50%;background:var(--gold)}
.mark i{display:block;width:3px;background:var(--ink)}
.mark i:nth-child(1){height:8px}.mark i:nth-child(2){height:16px}.mark i:nth-child(3){height:11px}
.message{position:absolute;top:144px;left:56px}
.message h1{margin:0;color:var(--paper);font:400 88px/.99 Anton,'Arial Narrow',sans-serif;letter-spacing:-.012em;text-transform:uppercase}
.message h1 span{display:block}
.message h1 em{color:var(--gold);font-style:normal}
.promise{position:absolute;left:56px;bottom:48px;margin:0;padding-top:15px;border-top:5px solid var(--coral);color:rgba(243,239,230,.66);font-size:12px;letter-spacing:.065em}
</style>
</head>
<body>
<main class="graphic" aria-label="Chants FC: know the words and start the next one">
  <img class="supporter" src="google-play-icon.png" alt="" aria-hidden="true">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>CHANTS FC</span></div>
  <section class="message">
    <h1><span>Know the words.</span><span>Start the <em>next one.</em></span></h1>
  </section>
  <p class="promise">YOUR MATCHDAY SONGBOOK, MADE BY SUPPORTERS.</p>
</main>
</body>
</html>
