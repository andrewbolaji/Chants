<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Chants</title>
    <meta
      name="description"
      content="The songbook, the workshop, and the stage for football chants."
    >
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #060606;
        color: #f5f1e8;
        font-family: Arial, sans-serif;
      }
      main { width: min(640px, calc(100% - 32px)); text-align: center; }
      strong { color: #ffc02e; letter-spacing: .14em; text-transform: uppercase; }
      h1 { font-size: clamp(54px, 18vw, 112px); margin: 18px 0; line-height: .9; }
      p { color: #c7c1b6; font-size: 18px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <strong>Chants FC</strong>
      <h1>CHANTS</h1>
      <p>The songbook, the workshop, and the stage. The public app is coming soon.</p>
    </main>
  </body>
</html>
