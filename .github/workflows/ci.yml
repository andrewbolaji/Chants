name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  project-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check project memory contract
        run: ./scripts/check-project-memory.sh
      - name: Check writing style
        run: ./scripts/check-writing-style.sh
      - name: Check native project contract
        run: ./scripts/check-native-project.sh
      - name: Test project governance checks
        run: ./scripts/test-project-governance.sh

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  flutter-analyze:
    runs-on: ubuntu-latest
    env:
      FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure Firebase options for static analysis
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            cat > lib/firebase_options.dart <<< "$FIREBASE_OPTIONS_DART"
          else
            cp lib/firebase_options.dart.example lib/firebase_options.dart
            echo "Using checked-in non-secret Firebase analysis fixture"
          fi
      - name: Analyze
        run: flutter analyze

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seed/package-lock.json
      - run: npm ci
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: test_rules
      - run: firebase emulators:exec --only firestore --project chants-f95b4 "cd test_rules && npm test"
