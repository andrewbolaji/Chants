name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  project-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check project memory contract
        env:
          PROJECT_MEMORY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/check-project-memory.sh --range "$PROJECT_MEMORY_BASE"
      - name: Check writing style
        run: ./scripts/check-writing-style.sh
      - name: Check native project contract
        run: ./scripts/check-native-project.sh
      - name: Check launch services contract
        run: node scripts/check-launch-services.mjs
      - name: Test launch services checks
        run: node scripts/test-launch-services-check.mjs
      - name: Test project governance checks
        run: ./scripts/test-project-governance.sh
      - name: Test local device preparation and walkthrough guide
        run: node --test scripts/test-device-readiness.mjs scripts/test-launch-guide.mjs

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - name: Retain failed golden evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-golden-failures-${{ github.sha }}
          path: test/**/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  flutter-analyze:
    runs-on: ubuntu-latest
    env:
      FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure Firebase options for static analysis
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            cat > lib/firebase_options.dart <<< "$FIREBASE_OPTIONS_DART"
          else
            cp lib/firebase_options.dart.example lib/firebase_options.dart
            echo "Using checked-in non-secret Firebase analysis fixture"
          fi
      - name: Analyze
        run: flutter analyze

  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure non-secret Android build fixtures
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart
          cp android/app/google-services.json.example android/app/google-services.json
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK identity and record digest
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          apkanalyzer_path="$android_sdk_root/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$apkanalyzer_path"
          test "$("$apkanalyzer_path" manifest application-id build/app/outputs/flutter-apk/app-debug.apk)" = "com.chants.chants"
          sha256sum build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chants-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios-simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Configure non-secret iOS build fixtures
        run: |
          cp lib/firebase_options.dart.example lib/firebase_options.dart
          cp ios/Runner/GoogleService-Info.plist.example ios/Runner/GoogleService-Info.plist
      - name: Resolve locked CocoaPods graph
        run: pod install
        working-directory: ios
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign
      - name: Verify app identity and exact source
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          test "$(plutil -extract CFBundleIdentifier raw build/ios/iphonesimulator/Runner.app/Info.plist)" = "com.chants.chants"
          git rev-parse HEAD

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seed/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: test_rules
      - run: npm ci && npm run build && npx tsc -p tsconfig.test.json
        working-directory: functions
      - run: firebase emulators:exec --only firestore,storage --project chants-f95b4 "cd test_rules && npm test"
      - name: Rehearse repair and upload transactions in the emulator
        run: firebase emulators:exec --only firestore --project demo-chants-repair "cd functions && npx mocha --timeout 60000 lib-test/test/report_repair.integration.test.js"
