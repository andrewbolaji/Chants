name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test

  flutter-analyze:
    runs-on: ubuntu-latest
    env:
      FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Write Firebase options from secret
        if: ${{ env.FIREBASE_OPTIONS_DART != '' }}
        run: cat > lib/firebase_options.dart <<< "$FIREBASE_OPTIONS_DART"
      - name: Analyze
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "Skipping analyze: FIREBASE_OPTIONS_DART secret not set"
            exit 0
          fi
          flutter analyze

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test

  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seed/package-lock.json
      - run: npm ci
      - run: npm test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools@15
      - run: npm ci
        working-directory: test_rules
      - run: firebase emulators:exec --only firestore --project chants-f95b4 "cd test_rules && npm test"
